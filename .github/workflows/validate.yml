name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      # The core Android TV Remote integration's library, at the version HA pins.
      - run: pip install $(python tools/ha_requirements.py androidtv_remote)
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools
      - run: mypy custom_components/tv_voice_bridge
      - run: pytest --cov=custom_components.tv_voice_bridge --cov-report=term-missing
      - run: npm run check && npm test
      - run: python tools/check_release.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
