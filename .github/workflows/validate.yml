name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      # The coverage step pushes its badge and report to a data branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      # The core Android TV Remote integration's library, at the version HA pins.
      - run: pip install $(python tools/ha_requirements.py androidtv_remote)
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools
      - run: mypy custom_components/tv_voice_bridge
      - run: pytest --cov=custom_components.tv_voice_bridge --cov-report=term-missing
      - run: npm run check && npm test
      - run: python tools/check_release.py
      - name: Coverage badge and summary
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
