name: Package release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/check_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: cd custom_components/tv_voice_bridge && zip -r ../../tv_voice_bridge.zip . -x '*/__pycache__/*' '*.pyc'
      - run: gh release upload "$RELEASE_TAG" tv_voice_bridge.zip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
