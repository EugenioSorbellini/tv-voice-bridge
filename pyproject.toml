[project]
name = "tv-voice-bridge"
version = "1.3.0"
description = "Home Assistant browser microphone bridge to paired Android TVs"
requires-python = ">=3.14.2"
license = "MIT"

[tool.coverage.run]
# Required by the coverage badge action, which reads the data in another container.
relative_files = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.tv_voice_bridge"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
